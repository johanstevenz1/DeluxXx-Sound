<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Diagnóstico YouTube · DeluxXx Sound</title>
<style>body{font:16px system-ui;background:#071326;color:#eaf0ff;max-width:800px;margin:40px auto;padding:20px}input,select,button{font:inherit;padding:12px;margin:6px;background:#17243a;color:white;border:1px solid #687895;border-radius:8px}iframe{width:100%;height:400px;border:0}a{color:#accbff}</style></head><body>
<h1>Comprobar reproducción de YouTube</h1><p>Esta prueba usa directamente el reproductor oficial, sin la cola ni la búsqueda de alternativas de DeluxXx Sound.</p>
<form id="form"><label>ID del video <input id="video" value="M7lc1UVf-VE" required pattern="[A-Za-z0-9_-]{11}"></label><label>Reproductor <select id="host"><option value="www.youtube.com">YouTube estándar</option><option value="www.youtube-nocookie.com">Modo de privacidad</option></select></label><button id="test" disabled>Probar reproducción</button></form>
<p id="status" role="status">Conectando con la API oficial…</p><p id="origin"></p><div id="shell"><div id="player"></div></div><p><a href="/">Volver a DeluxXx Sound</a></p>
<script>
let player=null;
const status=document.getElementById('status');
document.getElementById('origin').textContent='Origen enviado: '+location.origin;
window.onYouTubeIframeAPIReady=()=>{document.getElementById('test').disabled=false;status.textContent='API lista. El video inicial es el ejemplo de la documentación de YouTube.';};
document.getElementById('form').addEventListener('submit',event=>{
 event.preventDefault(); const id=document.getElementById('video').value.trim();
 if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;
 if(player){player.destroy();player=null;}
 const iframe=document.createElement('iframe');iframe.id='player';iframe.title='Reproductor oficial de YouTube';
 iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';
 const url=new URL('https://'+document.getElementById('host').value+'/embed/'+id);
 url.search=new URLSearchParams({enablejsapi:'1',origin:location.origin,playsinline:'1',controls:'1',autoplay:'0'}).toString();iframe.src=url;
 document.getElementById('shell').replaceChildren(iframe);status.textContent='Cargando '+id+'…';
 player=new YT.Player('player',{events:{onReady:event=>event.target.playVideo(),onStateChange:event=>{if(event.data===1)status.textContent='Reproduciendo '+id+' con el reproductor oficial.';},onError:event=>{status.textContent='YouTube devuelve código '+event.data+' para '+id+'. Esta respuesta también ocurre sin el código del reproductor de la aplicación.';},onAutoplayBlocked:()=>{status.textContent='Pulsa reproducir dentro del video para autorizar el audio.';}}});
});
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
